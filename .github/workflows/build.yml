name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.target.runs-on }}
    strategy:
      matrix:
        target:
          - runs-on: ubuntu-26.04
            targets: //...
          - runs-on: ubuntu-26.04-arm
            targets: //crates/...
          - runs-on: macos-15
            targets: //...
      fail-fast: false
    steps:
      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e
      - name: Prepare for build
        run: |
          bazel/setup-ci.sh
          mkdir -p editors/code/dist
        # env:
        #   BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build
        run: bazel build ${{ matrix.target.targets }}
      - name: Run tests
        run: bazel test --build_tests_only ${{ matrix.target.targets }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e
      - name: Prepare for build
        run: |
          # echo 'import %workspace%/bazel/remote-cache.bazelrc' >>.bazelrc
          # echo "build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >>.bazelrc
          echo "startup --output_base=C:/o" >>.bazelrc
          echo "startup --windows_enable_symlinks" >>.bazelrc
          mkdir -p editors/code/dist
        shell: bash
        # env:
        #   BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build
        run: bazel build //crates/...
      - name: Run tests
        run: bazel test --build_tests_only //crates/...
